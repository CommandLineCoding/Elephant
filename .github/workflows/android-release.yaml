name: Build Apk and Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  apk:
    name: Flutter APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java (required for Android builds)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Pinned so release APKs and F-Droid's build (which reads this line)
      # use the same Flutter version.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Check the tag matches pubspec.yaml
        working-directory: mobile
        run: |
          version=$(sed -n -E 's/^version:[[:space:]]*([^+]+)\+.*/\1/p' pubspec.yaml)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match pubspec.yaml version $version. Bump version (and its +build number) before tagging."
            exit 1
          fi

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; APKs are signed with a throwaway debug key and can't update each other."
            echo "ELEPHANT_ALLOW_DEBUG_SIGNING=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "ELEPHANT_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "ELEPHANT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ELEPHANT_KEY_ALIAS=$KEY_ALIAS"
            echo "ELEPHANT_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Run Flutter analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        working-directory: mobile
        run: |
          flutter build apk --release --split-per-abi --no-tree-shake-icons
          flutter build apk --release --no-tree-shake-icons

      - name: Rename APKs with version tag
        run: |
          mv mobile/build/app/outputs/flutter-apk/app-release.apk mobile/build/app/outputs/flutter-apk/elephant-${{ github.ref_name }}-universal.apk
          mv mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk mobile/build/app/outputs/flutter-apk/elephant-${{ github.ref_name }}-armeabi-v7a.apk
          mv mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk mobile/build/app/outputs/flutter-apk/elephant-${{ github.ref_name }}-arm64-v8a.apk
          mv mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk mobile/build/app/outputs/flutter-apk/elephant-${{ github.ref_name }}-x86_64.apk

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Elephant ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: mobile/build/app/outputs/flutter-apk/elephant-${{ github.ref_name }}-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
