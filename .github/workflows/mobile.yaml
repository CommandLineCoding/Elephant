name: App Checks

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yaml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yaml'

permissions:
  contents: read

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Same version as the release workflow, so checks and releases agree.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
