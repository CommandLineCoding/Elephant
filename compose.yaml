# Elephant: PostgreSQL, the migrations, and the server.
#
#   cp .env.example .env     # then set JWT_SECRET and POSTGRES_PASSWORD
#   docker compose up -d     # or: podman-compose up -d
#
# This runs the published image. To build the server from your checkout and to
# reach the database from the host (for development), add compose.dev.yaml:
#
#   docker compose -f compose.yaml -f compose.dev.yaml up -d --build

# Every container drops all Linux capabilities, can't gain new privileges, and
# has a read-only filesystem (writable only where a service lists a volume or
# tmpfs).
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true

services:
  db:
    <<: *hardened
    image: postgres:16-alpine
    container_name: elephant_db
    user: "70:70" # the image's postgres user, so it never runs as root
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /run/postgresql
    # Only reachable from the server and the migration job. Nothing is
    # published to the host; compose.dev.yaml does that for development.
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    <<: *hardened
    image: postgres:16-alpine
    container_name: elephant_migration
    user: "70:70"
    volumes:
      - ./server/migrations:/migrations:ro,z
      - ./server/migrate.sh:/migrate.sh:ro,z
    tmpfs:
      - /tmp
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    entrypoint: ["/bin/sh", "/migrate.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  server:
    <<: *hardened
    image: ${ELEPHANT_IMAGE:-ghcr.io/commandlinecoding/elephant:latest}
    container_name: elephant_server
    # The server writes nothing, so any unprivileged id works. Set these if you
    # want it to match a particular user on the host.
    user: "${ELEPHANT_UID:-1000}:${ELEPHANT_GID:-1000}"
    tmpfs:
      - /tmp
    ports:
      - "${PORT}:${PORT}"
    environment:
      - HOST=${HOST}
      - PORT=${PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PORT=5432
      - POSTGRES_HOST=db
      - JWT_SECRET=${JWT_SECRET}
      - ARGON_MEMORY=${ARGON_MEMORY}
      - ARGON_ITERATIONS=${ARGON_ITERATIONS}
      - ARGON_PARALLELISM=${ARGON_PARALLELISM}
      - GOMEMLIMIT=${GOMEMLIMIT:-400MiB}
      - AUTO_MIGRATE=${AUTO_MIGRATE:-true}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URL=${GITHUB_REDIRECT_URL}
      - REGISTRATION=${REGISTRATION:-open}
      - PUSH_ALLOW_PRIVATE_ENDPOINTS=${PUSH_ALLOW_PRIVATE_ENDPOINTS:-false}
      - ARGON_MAX_CONCURRENT=${ARGON_MAX_CONCURRENT:-2}
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-auto}
    depends_on:
      migration:
        condition: service_completed_successfully
    # backend reaches the database; frontend carries the published port and the
    # server's own outbound requests (Google/GitHub sign-in, push pings).
    networks:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pgdata:

networks:
  # No route in or out, so the database can only be reached by its neighbours.
  backend:
    internal: true
  frontend: {}
