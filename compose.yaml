services:
  db:
    image: postgres:16-alpine
    container_name: elephant_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - elephant_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    image: postgres:16-alpine
    container_name: elephant_migration
    volumes:
      - ./server/migrations:/migrations:z
      - ./server/migrate.sh:/migrate.sh:z
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    entrypoint: ["/bin/sh", "/migrate.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - elephant_net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: elephant_server
    ports:
      - "${PORT}:${PORT}"
    environment:
      - HOST=${HOST}
      - PORT=${PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PORT=5432
      - POSTGRES_HOST=db
      - JWT_SECRET=${JWT_SECRET}
      - ARGON_MEMORY=${ARGON_MEMORY}
      - ARGON_ITERATIONS=${ARGON_ITERATIONS}
      - ARGON_PARALLELISM=${ARGON_PARALLELISM}
      - AUTO_MIGRATE=${AUTO_MIGRATE:-true}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URL=${GITHUB_REDIRECT_URL}
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - elephant_net
    restart: unless-stopped

volumes:
  pgdata:

networks:
  elephant_net:
    driver: bridge